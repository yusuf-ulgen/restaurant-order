worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths configured for non-root execution and read-only filesystem (/tmp is tmpfs)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Health probe endpoint for container & load balancer
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # Cache static assets immutable for 1 year
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Never cache index.html to ensure instant updates on new deploys
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires -1;
        }

        # SPA route refresh fallback to index.html (prevents 404 on deep links)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
