# ==============================================================================
# NGINX REVERSE PROXY CONFIGURATION (deploy/nginx/nginx.conf)
# ==============================================================================
# Acts as the blue-green ingress router.
# Routes incoming traffic to the active upstream defined in conf.d/upstream.conf.
# Supports domain-based routing for API and web apps, plus a path-based fallback.
# ==============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    include conf.d/*.conf;

    # Shared proxy headers for all virtual hosts
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # API Ingress
    server {
        listen 80;
        server_name api.* api.local;

        location / {
            proxy_pass http://api_backend;
        }
    }

    # Customer Web App Ingress
    server {
        listen 80;
        server_name order.* customer.* order.local;

        location / {
            proxy_pass http://customer_web_backend;
        }
    }

    # Waitstaff & POS Operations Web App Ingress
    server {
        listen 80;
        server_name ops.* waiter.* ops.local;

        location / {
            proxy_pass http://operations_web_backend;
        }
    }

    # Admin Panel Ingress
    server {
        listen 80;
        server_name admin.* admin.local;

        location / {
            proxy_pass http://admin_web_backend;
        }
    }

    # Default fallback: /api routes to API backend, all other routes to customer web
    server {
        listen 80 default_server;
        server_name _;

        location /api/ {
            proxy_pass http://api_backend/;
        }

        location / {
            proxy_pass http://customer_web_backend;
        }
    }
}
