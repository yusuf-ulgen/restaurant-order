# ==============================================================================
# PRODUCTION SLOT BLUE DOCKER COMPOSE OVERRIDE (compose.prod.blue.yml)
# ==============================================================================
# Usage: docker compose -f compose.yml -f compose.prod.blue.yml up -d
# Blue slot runs on port 5001 for zero-conflict concurrent blue-green deployment.
# Production DB and Redis are managed external services; no container ports exposed.
# ==============================================================================

services:
  api:
    container_name: restaurant-order-api-blue
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      DEPLOYMENT_COLOR: blue
      PORT: 5000
    ports:
      - "${API_PORT_BLUE:-5001}:5000"

  worker:
    container_name: restaurant-order-worker-blue
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      DEPLOYMENT_COLOR: blue
      ACTIVE_DEPLOYMENT_SLOT: ${ACTIVE_DEPLOYMENT_SLOT:-blue}
