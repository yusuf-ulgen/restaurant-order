# ==============================================================================
# STAGING DOCKER COMPOSE OVERRIDE (compose.staging.yml)
# ==============================================================================
# Usage: docker compose -f compose.yml -f compose.staging.yml up -d
# Database & Redis ports are strictly internal and NOT bound to the host.
# Secrets (POSTGRES_PASSWORD, DATABASE_URL, JWT_SECRET) must be injected via
# environment variables or secret manager. Insecure fallback values are prohibited.
# Web frontends receive NO backend secrets; only public build variables.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-order-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_order_staging}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - app_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-restaurant_order_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: restaurant-order-redis-staging
    restart: unless-stopped
    volumes:
      - redis_staging_data:/data
    networks:
      - app_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: restaurant-order-api-staging
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      DEPLOYMENT_COLOR: ${DEPLOYMENT_COLOR:-blue}
      PORT: 5000
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    container_name: restaurant-order-worker-staging
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis:6379}
      DEPLOYMENT_COLOR: ${DEPLOYMENT_COLOR:-blue}
      ACTIVE_DEPLOYMENT_SLOT: ${ACTIVE_DEPLOYMENT_SLOT:-blue}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  customer-web:
    container_name: restaurant-order-customer-web-staging
    ports:
      - "${CUSTOMER_WEB_PORT:-3000}:8080"

  operations-web:
    container_name: restaurant-order-operations-web-staging
    ports:
      - "${OPERATIONS_WEB_PORT:-3001}:8080"

  admin-web:
    container_name: restaurant-order-admin-web-staging
    ports:
      - "${ADMIN_WEB_PORT:-3002}:8080"

volumes:
  postgres_staging_data:
  redis_staging_data:
